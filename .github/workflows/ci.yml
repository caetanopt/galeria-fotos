name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Valores falsos, apenas para o arranque passar a validação do
# lib/env.ts. Nenhum teste desta pipeline contacta o Supabase ou a
# Google — a rede é simulada em tests/e2e com page.route().
env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  GOOGLE_OAUTH_CLIENT_ID: ci-client-id
  GOOGLE_OAUTH_CLIENT_SECRET: ci-client-secret
  GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3000/api/google-drive/callback
  APP_ENCRYPTION_KEY: ci-encryption-key-com-32-bytes-ok
  APP_TOKEN_PEPPER: ci-token-pepper-16+
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm build

  e2e:
    name: Testes end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
